# Generated by `paws workflow generate` (github.com/mbround18/paws), then trimmed:
# paws's `ci --toolchain rust` runs in a stock rust:1-bookworm Dagger container with
# no cmake/pkg-config and no flag to add either, so it can't build our libopus_sys
# dependency (needs cmake to build Opus from source). Rust build/test/clippy/fmt
# lives in backend.yml instead, which installs those system deps directly. `paws
# docker` still owns the build/gate for our own Dockerfile, which already handles
# cmake/pkg-config in its build stage.
name: paws

on:
  push:
    branches: [main]
  pull_request:

jobs:
  paws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mbround18/paws/actions/paws-up@main

      # Build-only by default — add --push plus registry credentials (see `paws docker --help`) once you've set up registry secrets.
      - run: paws docker
