[package]
name = "lyre"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
dirs = "6.0.0"
once_cell = "1.21.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend", "utils", "cache"] }
songbird = { version = "0.6.0", features = ["serenity", "builtin-queue", "driver"] }
symphonia = { version = "0.6.0", default-features = false, features = ["mp3"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "fs", "process", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
which = "8.0.2"
dotenvy = "0.15.7"
actix-web = { version = "4.13.0", default-features = false, features = ["macros"] }
actix-files = "0.6.10"
actix-web-httpauth = "0.8.2"
base64 = "0.22.1"
walkdir = "2.5.0"
diesel = { version = "2.3.9", features = ["postgres", "chrono"] }
diesel_migrations = "2.3.2"
chrono = { version = "0.4.44", features = ["serde"] }
futures-util = "0.3.32"
num_cpus = "1.17.0"
tokio-postgres = "0.7.17"

[profile.dev]
# Optimize dev builds to reduce runtime hiccups without needing --release
opt-level = 2

[profile.release]
# Production build optimizations
opt-level = 3           # maximum optimizations for runtime perf
lto = "thin"            # link-time optimization (good balance of speed/size)
codegen-units = 1       # better cross-crate optimization
panic = "abort"         # smaller binary; abort on panic
debug = 0               # no debug info in final artifact
incremental = false     # full optimization, no incremental artifacts
strip = "symbols"       # strip symbols to reduce size

