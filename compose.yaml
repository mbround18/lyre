services:
  lyre:
    image: mbround18/lyre:${VERSION:-latest}
    container_name: lyre
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Required environment variables
      # - DISCORD_TOKEN=${DISCORD_TOKEN}
      - RUST_LOG=${RUST_LOG:-info}
      # Bind address for the embedded HTTP server
      - LYRE_HTTP_BIND=${LYRE_HTTP_BIND:-0.0.0.0:3000}
      # Optional: Path to cookies file for authenticated downloads
      # - COOKIES_FILE=/data/cookies/cookies.txt
    ports:
      - "3000:3000"
    volumes:
      - lyre-data:/data
      # Optional: Mount your cookies.txt file for authenticated downloads
      # - ./cookies.txt:/data/cookies/cookies.txt:ro

volumes:
  lyre-data:
