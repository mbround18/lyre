services:
  db:
    image: postgres:18-alpine
    container_name: lyre-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lyre
    volumes:
      - lyre-db-data:/var/lib/postgresql
    networks:
      - lyre-net

  lyre:
    image: mbround18/lyre:${VERSION:-latest}
    container_name: lyre
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - LYRE_HTTP_BIND=${LYRE_HTTP_BIND:-0.0.0.0:3000}
      - DATABASE_URL=postgres://postgres:postgres@db:5432/lyre
    ports:
      - "3000:3000"
    volumes:
      - lyre-data:/data
    networks:
      - lyre-net
    depends_on:
      - db

networks:
  lyre-net:
    driver: bridge

volumes:
  lyre-data:
  lyre-db-data:
