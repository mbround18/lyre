services:
  db:
    image: postgres:18-alpine
    container_name: lyre-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lyre
    # Exposed to the host so `cargo run` outside of Docker (e.g. `make dev`) can connect.
    # Host port 5433 (not 5432) to avoid clashing with a Postgres from another project.
    ports:
      - "5433:5432"
    volumes:
      - lyre-db-data:/var/lib/postgresql
    networks:
      - lyre-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  lyre:
    image: mbround18/lyre:${VERSION:-latest}
    container_name: lyre
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - LYRE_HTTP_BIND=${LYRE_HTTP_BIND:-0.0.0.0:3000}
      - DATABASE_URL=postgres://postgres:postgres@db:5432/lyre
    ports:
      - "3000:3000"
    volumes:
      - lyre-data:/data
    networks:
      - lyre-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/k8s/livez"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  lyre-net:
    driver: bridge

volumes:
  lyre-data:
  lyre-db-data:
